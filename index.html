<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LSGBA Team Registration</title>
<link rel="icon" href="assets/favicon.png">
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0; background: #16171A; color: #ECEDEF;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  }
  header {
    padding: 32px 24px; text-align: center;
    background: linear-gradient(135deg, #8B1D41, #5E1230);
  }
  header img { height: 64px; margin-bottom: 12px; }
  header h1 { margin: 0; font-size: 1.4rem; font-weight: 600; }
  .headline { font-size: 3rem; font-weight: 700; margin: 12px 0 4px; }
  .headline .pct { font-size: 1.2rem; color: #D2B77C; margin-left: 8px; }
  main { max-width: 900px; margin: 0 auto; padding: 24px; }
  .grade-block { margin-bottom: 28px; }
  .grade-block h2 {
    font-size: 1rem; text-transform: uppercase; letter-spacing: 0.06em;
    color: #8E959F; border-bottom: 1px solid #31363E; padding-bottom: 6px;
  }
  .team { background: #1F2126; border: 1px solid #31363E; border-radius: 10px;
          padding: 14px 16px; margin-top: 10px; }
  .team-row { display: flex; justify-content: space-between; margin-bottom: 8px; }
  .team-label { font-weight: 600; }
  .team-count { color: #8E959F; font-variant-numeric: tabular-nums; }
  .bar { height: 8px; border-radius: 4px; background: #262A30; overflow: hidden; }
  .bar-fill { height: 100%; background: #46AD69; }
  .unmatched { margin-top: 8px; padding: 14px 16px; border-radius: 10px;
               background: #1F2126; border: 1px solid #31363E; color: #8E959F; }
  footer { text-align: center; color: #8E959F; font-size: 0.85rem; padding: 24px; }
</style>
</head>
<body>
<header>
  <img src="assets/lsgba-badge-solid.png" alt="LSGBA">
  <h1>2026-2027 Travel Roster Registration</h1>
  <div class="headline">32 / 76<span class="pct">42%</span></div>
</header>
<main>

    <section class="grade-block">
      <h2>Grade 3</h2>
      
      <div class="team">
        <div class="team-row">
          <span class="team-label">3 Gold</span>
          <span class="team-count">5 / 8</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:62%"></div></div>
      </div>
    </section>
    <section class="grade-block">
      <h2>Grade 4</h2>
      
      <div class="team">
        <div class="team-row">
          <span class="team-label">4 Gold</span>
          <span class="team-count">6 / 9</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:67%"></div></div>
      </div>
      <div class="team">
        <div class="team-row">
          <span class="team-label">4 Red</span>
          <span class="team-count">5 / 9</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:56%"></div></div>
      </div>
    </section>
    <section class="grade-block">
      <h2>Grade 5</h2>
      
      <div class="team">
        <div class="team-row">
          <span class="team-label">5 Gold</span>
          <span class="team-count">3 / 8</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:38%"></div></div>
      </div>
      <div class="team">
        <div class="team-row">
          <span class="team-label">5 Red</span>
          <span class="team-count">0 / 8</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:0%"></div></div>
      </div>
    </section>
    <section class="grade-block">
      <h2>Grade 6</h2>
      
      <div class="team">
        <div class="team-row">
          <span class="team-label">6 Gold</span>
          <span class="team-count">3 / 8</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:38%"></div></div>
      </div>
      <div class="team">
        <div class="team-row">
          <span class="team-label">6 Red</span>
          <span class="team-count">3 / 8</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:38%"></div></div>
      </div>
      <div class="team">
        <div class="team-row">
          <span class="team-label">6 White</span>
          <span class="team-count">2 / 8</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:25%"></div></div>
      </div>
    </section>
    <section class="grade-block">
      <h2>Grade 8</h2>
      
      <div class="team">
        <div class="team-row">
          <span class="team-label">8 Gold</span>
          <span class="team-count">5 / 10</span>
        </div>
        <div class="bar"><div class="bar-fill" style="width:50%"></div></div>
      </div>
    </section>

</main>
<footer>Updated Sep 3, 2026 7:06 PM</footer>
</body>
</html>
